name: Fetch real UK bus data from BODS

# Runs on a GitHub runner because a runner is the machine with a route to the
# internet -- the sandbox MoveIn is developed in cannot reach BODS at all, and
# no API key changes that.  Triggered by a change to `ops/fetch-bods`, a sentinel
# file, so ordinary commits do not start fetches and the artifact this job
# commits cannot trigger itself.
#
# The work itself lives in ops/fetch-bods.sh.

on:
  push:
    paths:
      - 'ops/fetch-bods'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and compile
        env:
          MOVEIN_BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          MOVEIN_BODS_ALLOW_ANONYMOUS: '1'
        run: bash ops/fetch-bods.sh 60 2>&1 | tee ops/last-run.txt

      - name: Commit the report and whatever was compiled
        if: always()
        run: |
          git config user.name 'movein-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ops/last-run.txt
          git add backend/data/raw/real_bus_routes/compiled_bods.json.gz || true
          git add -f backend/data/raw/bods/manifest.json || true
          git commit -m 'BODS fetch report and compiled routes' || echo 'nothing changed'
          git push || echo 'push failed'
