name: Fetch real UK bus data from BODS

# A GitHub runner is the machine with a route to the internet: the sandbox
# MoveIn is developed in cannot reach the DfT Bus Open Data Service at all (TLS
# is dropped before a request is sent, and no API key changes that).  So the
# national download happens here and the compiled result is committed back.
#
# Triggered by a change to `ops/fetch-bods`, a sentinel file, so ordinary
# commits start no fetches -- and because the artifact this job commits is not
# in the paths filter, the job cannot trigger itself.
#
# The work lives in `ops/fetch-bods.sh`, which can be read and run as ordinary
# code.  Everything it prints is also written to ops/last-run.txt and committed,
# because a log on a runner is otherwise unreachable from where this is read.

on:
  push:
    paths:
      - 'ops/fetch-bods'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bods-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MOVEIN_BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
      MOVEIN_BODS_ALLOW_ANONYMOUS: '1'
      MOVEIN_BODS_REPORT: ops/last-run.txt
      REPORT: ops/last-run.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and compile the published bus data
        id: bods
        continue-on-error: true
        run: |
          echo "report file: '$MOVEIN_BODS_REPORT' (cwd $(pwd))" | tee -a "$MOVEIN_BODS_REPORT"
          bash ops/fetch-bods.sh 60 2>&1 | tee -a "$MOVEIN_BODS_REPORT"
          echo "exit of the pipeline: ${PIPESTATUS[0]}"
          echo "report is now $(wc -c < "$MOVEIN_BODS_REPORT") bytes"

      - name: Commit the report and anything that was compiled
        if: always()
        run: |
          {
            echo "=== commit $(date -u +%FT%TZ) ==="
            echo "report: $(ls -l "$MOVEIN_BODS_REPORT" 2>&1)"
            git config user.name 'movein-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f "$MOVEIN_BODS_REPORT"
            git add -f backend/data/raw/real_bus_routes/compiled_bods_*.json.gz || true
            git add -f backend/data/raw/real_bus_routes/compiled_bods.json.gz || true
            git add -f backend/data/raw/bods/manifest.json || true
            git add -f backend/data/raw/bods_extract/ || true
            git status --short
            git commit -m 'BODS fetch report and compiled routes' || echo 'nothing to commit'
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
              if git push origin "HEAD:$GITHUB_REF_NAME"; then echo "pushed on attempt $attempt"; break; fi
              sleep 10
            done
          } 2>&1 | tee -a "$MOVEIN_BODS_REPORT"
